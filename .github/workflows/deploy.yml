# Deploy workflow:
# - Push/merge to main → TEST  https://test.hero.hands-on-technology.org  (app: ~/public_html/hero-test)
# - Publish a Release  → PROD  https://hero.hands-on-technology.org       (app: ~/public_html/hero-prod)
# The web root of each host must point to <app>/public (Laravel serves the SPA and /api).
#
# SSH secrets: TEST_DEPLOY_* (test) and DEPLOY_* (prod) — HOST, USER, KEY, PORT.
# Each server keeps its own <app>/.env (see backend/.env.example).
#
# Optional e-mail on published GitHub Release only (repository variable DEPLOY_NOTIFY_ENABLED=true).
# Microsoft 365 via Graph OAuth (client credentials) — no SMTP.
# Entra app: Application permission Mail.Send + admin consent.
# Secrets:
#   DEPLOY_NOTIFY_MS_TENANT_ID
#   DEPLOY_NOTIFY_MS_CLIENT_ID
#   DEPLOY_NOTIFY_MS_CLIENT_SECRET
#   DEPLOY_NOTIFY_MAIL_FROM   — sender mailbox UPN (e.g. noreply@…)
#   DEPLOY_NOTIFY_EMAIL_TO    — recipient(s), comma-separated

name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

jobs:
  deploy-test:
    name: Deploy to Test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'test')
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      secret_prefix: TEST_
      build_script: build:test
      app_dir: public_html/hero-test
      temp_dir: deploy-tmp/hero-test
      app_url: https://test.hero.hands-on-technology.org
    secrets: inherit

  deploy-prod:
    name: Deploy to Prod
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      secret_prefix: ''
      build_script: build
      app_dir: public_html/hero-prod
      temp_dir: deploy-tmp/hero-prod
      app_url: https://hero.hands-on-technology.org
    secrets: inherit

  notify-release:
    name: Notify release deploy
    needs: deploy-prod
    if: always() && github.event_name == 'release' && vars.DEPLOY_NOTIFY_ENABLED == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify release deploy by email (Microsoft Graph)
        env:
          MS_TENANT_ID: ${{ secrets.DEPLOY_NOTIFY_MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.DEPLOY_NOTIFY_MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.DEPLOY_NOTIFY_MS_CLIENT_SECRET }}
          MAIL_FROM: ${{ secrets.DEPLOY_NOTIFY_MAIL_FROM }}
          MAIL_TO: ${{ secrets.DEPLOY_NOTIFY_EMAIL_TO }}
          JOB_STATUS: ${{ needs.deploy-prod.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          ACTOR: ${{ github.actor }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_HOST }}:hero-prod
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash deploy/notify-release-email-graph.sh
